spring.application.name=multi-tenant-notification-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dmg_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Dispatch engine
notification.dispatch.core-pool-size=4
notification.dispatch.max-pool-size=8
notification.dispatch.queue-capacity=200
notification.dispatch.poll-interval-ms=2000

# Retry backoff
notification.retry.base-delay-seconds=5
notification.retry.max-delay-seconds=60

# Simulated channel senders
notification.simulation.failure-rate=0.3